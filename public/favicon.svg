<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AS">
  <!--
    Monograma. Una forma llena se lee mejor que letras finas a 16 px, asi que
    el fondo carga el peso y las iniciales van caladas.
    El favicon anterior era el logo por defecto de Astro.
  -->
  <rect class="fondo" width="64" height="64" rx="12" />
  <text
    class="letras"
    x="32"
    y="33"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="34"
    font-weight="600"
    letter-spacing="-1.5"
  >AS</text>
  <style>
    .fondo { fill: #1a1816; }
    .letras { fill: #faf9f7; }
    @media (prefers-color-scheme: dark) {
      .fondo { fill: #eae5dc; }
      .letras { fill: #14120f; }
    }
  </style>
</svg>
